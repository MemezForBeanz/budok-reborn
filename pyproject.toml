[project]
name = "budok-dev"
version = "1.0.0"
description = "Repository tooling and tests for the budok YOMI Hustle mod."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "jsonschema>=4.23.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
